<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="description" content="{{ page.description | default: page.title }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}">

  <style>
    .hr { width: 100%; height: 1px; margin: 48px 0; background-color: #d6dbdf; }
    /* ORCID mark keeps its brand green even inside the blue author links. */
    .author-block .ai-orcid { color: #a6ce39 !important; }
    .author-block .ai-orcid:hover { color: #8ab029 !important; }
    /* Long affiliation lines should wrap instead of overflowing on mobile. */
    .publication-affiliations .author-block { white-space: normal; }
    .publication-corresponding {
      margin-top: 0.4rem;
      color: #4f4f4f;
      font-family: 'Google Sans', sans-serif;
      font-size: 1rem;
    }
    /* Slightly smaller affiliation lines (overrides the template's 1.15rem). */
    .publication-authors.publication-affiliations { font-size: 1.02rem; }
    /* "To Be Announced" buttons: greyed out and non-clickable until the
       real link is available. */
    .publication-links .button.is-tba {
      background: #9aa0a6;
      border-color: #9aa0a6;
      box-shadow: none;
      cursor: default;
      pointer-events: none;
    }
    /* Descriptive second half of the title: smaller, lighter, and muted so the
       "Lambda-Hold Control:" name stays the focal point. */
    .publication-title .publication-subtitle {
      display: block;
      margin-top: 0.55rem;
      color: #6a6f76;
      font-size: 1.6rem;
      font-weight: 500;
      line-height: 1.3;
    }
    @media screen and (max-width: 768px) {
      .publication-title .publication-subtitle {
        margin-top: 0.4rem;
        font-size: 1.1rem;
      }
    }
    /* Keep every link button on the same baseline. The template only margins
       <a> buttons, so the non-clickable (span) TBA buttons would otherwise sit
       higher than the active ones. */
    .publication-links { align-items: center; }
    .publication-links .link-block .button {
      margin-top: 5px;
      margin-bottom: 5px;
    }
    /* Author names stay plain; a small home icon beside each name links to the
       author's personal homepage. */
    .author-block .author-home {
      font-size: 0.82em;
      margin-left: 0.18rem;
    }
    /* Text overlays drawn on top of a video (or figure): corner labels and an
       optional bottom caption bar. The video itself is never modified. */
    .media-frame {
      position: relative;
      display: inline-block;
      width: 100%;
      line-height: 0;
      border-radius: 10px;
      overflow: hidden;
    }
    .media-frame > video,
    .media-frame > img,
    .media-frame > .placeholder-media {
      display: block;
      width: 100%;
      border-radius: 0;
    }
    .media-label {
      position: absolute;
      top: 0.6rem;
      left: 0.6rem;
      padding: 0.22rem 0.7rem;
      background: rgba(20, 20, 20, 0.72);
      color: #fff;
      border-radius: 6px;
      font-family: 'Google Sans', sans-serif;
      font-size: 0.9rem;
      font-weight: 600;
      line-height: 1.2;
    }
    .media-label.is-good { background: rgba(33, 110, 60, 0.82); }
    .media-label.is-bad  { background: rgba(150, 45, 45, 0.82); }
    .media-caption-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 1.6rem 0.9rem 0.7rem;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.72), rgba(0, 0, 0, 0));
      color: #fff;
      font-family: 'Noto Sans', sans-serif;
      font-size: 0.9rem;
      line-height: 1.35;
      text-align: left;
    }
    /* Teaser: several clips of the same motion shown side by side. */
    .teaser-strip {
      display: flex;
      gap: 4px;
      max-width: 900px;
      margin: 0 auto;
    }
    .teaser-strip > * { flex: 1 1 0; min-width: 0; }
    .teaser-strip video {
      width: 100%;
      height: auto;
      aspect-ratio: 64 / 85;
      display: block;
      border-radius: 6px;
    }
    .teaser-strip .media-label {
      top: 0.4rem;
      left: 0.4rem;
      padding: 0.14rem 0.5rem;
      font-size: 0.8rem;
    }
    /* Training-progression comparison grid (stage rows x method columns). */
    .progress-grid {
      display: grid;
      grid-template-columns: minmax(78px, 104px) repeat(5, 1fr);
      gap: 0.5rem 0.45rem;
      align-items: center;
      margin: 0 auto;
      width: 100%;
    }
    /* Top-left label describing the stage column. */
    .pg-corner {
      font-family: 'Google Sans', sans-serif;
      font-weight: 700;
      font-size: 0.82rem;
      color: #2f2f2f;
      text-align: right;
      padding-right: 0.3rem;
      line-height: 1.2;
    }
    /* Method names are the column headers (top row). */
    .pg-method {
      font-family: 'Google Sans', sans-serif;
      font-weight: 700;
      font-size: 0.9rem;
      color: #2f2f2f;
      text-align: center;
      line-height: 1.2;
    }
    /* Stage names are the row headers (left column). */
    .pg-stage {
      font-family: 'Google Sans', sans-serif;
      font-weight: 600;
      font-size: 0.85rem;
      color: #363636;
      text-align: right;
      padding-right: 0.3rem;
      line-height: 1.2;
    }
    .pg-ours { color: hsl(204, 86%, 45%); }
    .pg-cell { line-height: 0; }
    .pg-cell video {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 64 / 85;
      border-radius: 8px;
      border: 1px solid #e6e6e6;
    }
    /* Light-blue box drawn behind the Ours column (header + its three clips). */
    .pg-highlight {
      grid-column: 2;
      grid-row: 1 / 5;
      align-self: stretch;
      margin: -6px;
      background: rgba(56, 132, 236, 0.10);
      border: 1.5px solid rgba(56, 132, 236, 0.45);
      border-radius: 10px;
      z-index: 0;
    }
    .pg-method, .pg-stage, .pg-cell { position: relative; z-index: 1; }
    /* Best-baseline pair (two views side by side). */
    .baseline-duo {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 0.9rem;
    }
    .baseline-duo .media-frame { flex: 0 1 300px; }
    .baseline-duo video { display: block; width: 100%; height: auto; aspect-ratio: 64 / 85; }
    /* Ours-vs-baseline head-to-head: two labelled groups of clips. */
    .baseline-compare {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      align-items: flex-start;
      gap: 1.4rem 2.2rem;
    }
    .bc-title {
      font-family: 'Google Sans', sans-serif;
      font-weight: 700;
      font-size: 1.05rem;
      margin-bottom: 0.5rem;
      color: #2f2f2f;
    }
    .baseline-compare .media-frame { flex: 0 1 190px; }
    .bc-note {
      max-width: 760px;
      margin: 1.3rem auto 0;
      color: #4f4f4f;
      font-family: 'Noto Sans', sans-serif;
      font-size: 0.95rem;
      line-height: 1.5;
    }
    /* Neutral stand-in shown wherever a real video/figure will go. */
    .placeholder-media {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin: 0 auto;
      background: #ededed;
      border: 1px dashed #b5b5b5;
      border-radius: 10px;
      color: #7a7a7a;
      font-family: 'Google Sans', sans-serif;
      font-size: 1.05rem;
    }
  </style>

  <link href="https://fonts.googleapis.com/css?family=Google+Sans|Noto+Sans|Castoro" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma-carousel@4.0.24/dist/css/bulma-carousel.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma-slider@2.0.5/dist/css/bulma-slider.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
  <link rel="stylesheet" href="{{ '/assets/nerfies/index.css' | relative_url }}">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bulma-carousel@4.0.24/dist/js/bulma-carousel.min.js"></script>
  <script src="{{ '/assets/nerfies/index.js' | relative_url }}"></script>
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      tex2jax: { inlineMath: [['$', '$'], ['\\(', '\\)']], processEscapes: true }
    });
  </script>
  <script type="text/javascript" async
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML"></script>
</head>

{{ content }}

<footer class="footer">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-8">
        <div class="content">
          <p>
            This website template is borrowed from
            <a href="https://github.com/nerfies/nerfies.github.io">Nerfies</a>.
          </p>
        </div>
      </div>
    </div>
  </div>
</footer>

<!-- Video playback manager: play only on-screen clips, and self-heal any clip
     that errors or freezes. The local dev server (WEBrick) can drop a byte-range
     request when many clips load at once, which surfaces as a "data source
     error"; a staggered reload almost always recovers it. -->
<script>
document.addEventListener('DOMContentLoaded', function () {
  var vids = [].slice.call(document.querySelectorAll('video[loop]'));
  if (!vids.length) return;

  function onScreen(v) {
    var r = v.getBoundingClientRect();
    var vh = window.innerHeight || document.documentElement.clientHeight;
    var vw = window.innerWidth || document.documentElement.clientWidth;
    return r.bottom > 0 && r.top < vh && r.right > 0 && r.left < vw;
  }
  function tryPlay(v) { var p = v.play(); if (p && p.catch) { p.catch(function () {}); } }

  // Start clips a little apart so the local dev server isn't hit by every clip
  // at once (its dropped byte-range requests are what cause playback errors).
  var queue = [], draining = false;
  function enqueue(v) {
    if (queue.indexOf(v) !== -1) return;
    queue.push(v);
    if (draining) return;
    draining = true;
    (function step() {
      if (!queue.length) { draining = false; return; }
      var x = queue.shift();
      if (onScreen(x) && !x.error) { tryPlay(x); }
      setTimeout(step, 160);
    })();
  }

  // Reload a clip ONLY on a hard media error, and rate-limit it so a flaky clip
  // can never get stuck in a reload / restart loop.
  function recover(v) {
    var now = new Date().getTime();
    if (v.__next && now < v.__next) return;
    var n = v.__tries || 0;
    if (n >= 8) return;                       // stop after several honest tries
    v.__tries = n + 1;
    v.__next = now + 2500 + n * 1500;         // grows between reloads
    if (!onScreen(v)) return;
    try { v.load(); } catch (e) {}
    setTimeout(function () { if (onScreen(v) && !v.__offscreen) { tryPlay(v); } }, 90);
  }

  vids.forEach(function (v) {
    v.addEventListener('error', function () { recover(v); });
    // Resume only if the browser (not our observer) paused an on-screen clip.
    v.addEventListener('pause', function () {
      if (!v.ended && !v.__offscreen && onScreen(v)) { enqueue(v); }
    });
    // Once a clip has genuinely played for a bit, clear its retry budget.
    v.addEventListener('timeupdate', function () {
      if (v.currentTime > 1.5) { v.__tries = 0; }
    });
  });

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        var v = e.target;
        if (e.isIntersecting) {
          v.__offscreen = false;
          if (v.error) { recover(v); } else { enqueue(v); }
        } else {
          v.__offscreen = true;
          v.pause();
        }
      });
    }, { threshold: 0.1 });
    vids.forEach(function (v) { io.observe(v); });
  } else {
    vids.forEach(enqueue);
  }
});
</script>

</body>
</html>
