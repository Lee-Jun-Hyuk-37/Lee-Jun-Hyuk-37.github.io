<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="description" content="{{ page.description | default: page.title }}">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>

  <link rel="icon" type="image/png" sizes="32x32" href="{{ '/images/favicon-32x32.png' | relative_url }}">
  <link rel="apple-touch-icon" href="{{ '/images/apple-touch-icon-180x180.png' | relative_url }}">

  <style>
    .hr { width: 100%; height: 1px; margin: 48px 0; background-color: #d6dbdf; }
    /* ORCID mark keeps its brand green even inside the blue author links. */
    .author-block .ai-orcid { color: #a6ce39 !important; }
    .author-block .ai-orcid:hover { color: #8ab029 !important; }
    /* Long affiliation lines should wrap instead of overflowing on mobile. */
    .publication-affiliations .author-block { white-space: normal; }
    .publication-corresponding {
      margin-top: 0.4rem;
      color: #4f4f4f;
      font-family: 'Google Sans', sans-serif;
      font-size: 1rem;
    }
    /* "To Be Announced" buttons: greyed out and non-clickable until the
       real link is available. */
    .publication-links .button.is-tba {
      background: #9aa0a6;
      border-color: #9aa0a6;
      box-shadow: none;
      cursor: default;
      pointer-events: none;
    }
    /* Descriptive second half of the title: smaller, lighter, and muted so the
       "Lambda-Hold Control:" name stays the focal point. */
    .publication-title .publication-subtitle {
      display: block;
      margin-top: 0.55rem;
      color: #6a6f76;
      font-size: 1.6rem;
      font-weight: 500;
      line-height: 1.3;
    }
    @media screen and (max-width: 768px) {
      .publication-title .publication-subtitle {
        margin-top: 0.4rem;
        font-size: 1.1rem;
      }
    }
    /* Keep every link button on the same baseline. The template only margins
       <a> buttons, so the non-clickable (span) TBA buttons would otherwise sit
       higher than the active ones. */
    .publication-links { align-items: center; }
    .publication-links .link-block .button {
      margin-top: 5px;
      margin-bottom: 5px;
    }
    /* Author names stay plain; a small home icon beside each name links to the
       author's personal homepage. */
    .author-block .author-home {
      font-size: 0.82em;
      margin-left: 0.18rem;
    }
    /* Neutral stand-in shown wherever a real video/figure will go. */
    .placeholder-media {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin: 0 auto;
      background: #ededed;
      border: 1px dashed #b5b5b5;
      border-radius: 10px;
      color: #7a7a7a;
      font-family: 'Google Sans', sans-serif;
      font-size: 1.05rem;
    }
  </style>

  <link href="https://fonts.googleapis.com/css?family=Google+Sans|Noto+Sans|Castoro" rel="stylesheet">

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@0.9.4/css/bulma.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma-carousel@4.0.24/dist/css/bulma-carousel.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma-slider@2.0.5/dist/css/bulma-slider.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">
  <link rel="stylesheet" href="{{ '/assets/nerfies/index.css' | relative_url }}">

  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bulma-carousel@4.0.24/dist/js/bulma-carousel.min.js"></script>
  <script src="{{ '/assets/nerfies/index.js' | relative_url }}"></script>
  <script type="text/javascript" async
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.7/MathJax.js?config=TeX-MML-AM_CHTML"></script>
</head>
<body>

{{ content }}

<footer class="footer">
  <div class="container">
    <div class="columns is-centered">
      <div class="column is-8">
        <div class="content">
          <p>
            This website template is borrowed from
            <a href="https://github.com/nerfies/nerfies.github.io">Nerfies</a>.
          </p>
        </div>
      </div>
    </div>
  </div>
</footer>

</body>
</html>
